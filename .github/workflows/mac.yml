# Builds and tests the Mac version on a real Mac (Apple Silicon), then attaches
# FreeFlow-Mac.dmg to the GitHub release. The Windows installer is still built
# locally (it needs the NVIDIA CUDA libraries).
#   - automatically when a release is published;
#   - by hand (Actions > Version Mac > Run workflow): with a tag, the dmg is
#     attached to that release; without, it is only built, tested and kept as
#     an artifact of the run.
name: Version Mac

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release où joindre FreeFlow-Mac.dmg (vide = construire et tester seulement)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Moteur de transcription (faster-whisper + PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install "faster-whisper==1.2.1" pyinstaller
          python stt/build_stt.py

      - name: Lecteur de champ (apprendre des corrections)
        run: swiftc -O native/ax-read.swift -o native/ax-read

      - name: Application
        run: |
          npm ci || npm install --no-audit --no-fund
          npm test
          npm run package:mac

      - name: Signature ad hoc + image disque
        run: npm run dmg

      - name: Test sur le Mac (moteur, dictée, Deviner, captures)
        run: bash installer/mac-smoke-test.sh arm64

      - uses: actions/upload-artifact@v4
        with:
          name: FreeFlow-Mac
          path: release/installer/FreeFlow-Mac.dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-mac
          path: release/mac-test/

      - name: Joindre à la release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TAG" release/installer/FreeFlow-Mac.dmg --clobber
