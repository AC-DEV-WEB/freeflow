<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; script-src 'self'; worker-src 'self'">
  <title>FreeFlow overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body data-phase="idle">
  <!-- The panel ("déroulé"): recent dictations, notes, meeting, FreeFlow -->
  <section class="panel" id="panel" aria-label="Déroulé FreeFlow">
    <header class="p-head">
      <div class="p-brand"><img src="../../assets/icon.png" alt="" width="22" height="22">FreeFlow</div>
      <button class="icon x" data-act="close-panel" title="Fermer">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <button class="p-primary" data-act="copy-last">
      <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>
      <span><strong>Copier la dernière dictée</strong><small id="last-preview">Aucune dictée pour le moment</small></span>
    </button>
    <div class="p-label">Dictées récentes</div>
    <ul class="recent" id="recent"></ul>
    <div class="p-grid">
      <button class="p-tile" data-act="notes">
        <svg viewBox="0 0 24 24"><path d="M6 3.5h9l4 4V20a.5.5 0 0 1-.5.5h-12A.5.5 0 0 1 6 20z"/><path d="M15 3.5V8h4M9 12h7M9 15.5h5"/></svg>Notes</button>
      <button class="p-tile meeting" data-act="meeting" id="p-meeting">
        <span class="rec-dot"></span><span id="p-meeting-label">Réunion</span></button>
      <button class="p-tile" data-act="open">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg>Ouvrir FreeFlow</button>
    </div>
    <footer class="p-foot" id="p-foot"></footer>
  </section>

  <!-- A word learned from your corrections -->
  <div class="toast" id="learn" hidden>
    <div class="t-text"><span>Ajouter au dictionnaire ?</span><strong id="learn-word"></strong><small id="learn-heard"></small></div>
    <button class="t-yes" data-act="learn-accept">Ajouter</button>
    <button class="t-no" data-act="learn-dismiss" title="Non merci">Non</button>
  </div>

  <div class="flash" id="flash"></div>

  <!-- The bar: tiny at rest, a toolbar on hover, a clock while a meeting records -->
  <div class="bar" id="bar">
    <span class="nub"></span>
    <div class="tools">
      <button class="icon" data-act="dictate" id="b-dictate">
        <svg viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="icon" data-act="panel" id="b-panel">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
      </button>
      <button class="icon" data-act="open" title="Ouvrir FreeFlow">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg>
      </button>
    </div>
    <div class="rec" id="rec">
      <span class="rec-dot"></span><span class="rec-time" id="rec-time">00:00</span>
      <button class="icon small" data-act="meeting-pause" id="rec-pause" title="Pause">
        <svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>
      </button>
      <button class="rec-stop" data-act="meeting" title="Arrêter et transcrire la réunion">Arrêter</button>
    </div>
  </div>

  <!-- The dictation pill -->
  <div id="pill" class="pill" data-phase="idle" aria-live="polite">
    <div class="bars" id="bars"></div>
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="label" id="label">Écoute</div>
    <div class="p-actions">
      <button class="icon small" data-act="cancel" title="Annuler"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      <button class="icon small ok" data-act="finish" title="Terminer et coller"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    </div>
  </div>
  <script src="../../lib/i18n.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
